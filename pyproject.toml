[project]
name = "asciimath2"
version = "0.1.0"
description = "LaTeX -> AsciiMath2 conversion (AsciiMath2 = asciimath.org + the asciimath-parser extensions, see SPEC.md)"
readme = "README.md"
authors = [
    { name = "Alex Lee", email = "iasandcb@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["latex", "asciimath", "asciimath2", "math", "converter", "markup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]
dependencies = [
    "pylatexenc>=2.11",
]

[project.urls]
Homepage = "https://github.com/iasandcb/asciimath2"
Repository = "https://github.com/iasandcb/asciimath2"
Issues = "https://github.com/iasandcb/asciimath2/issues"
Specification = "https://github.com/iasandcb/asciimath2/blob/main/SPEC.md"

[project.scripts]
asciimath2 = "asciimath2.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
